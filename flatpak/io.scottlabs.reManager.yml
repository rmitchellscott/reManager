app-id: io.scottlabs.reManager
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: reManager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=ssh-auth
  - --filesystem=~/.ssh:ro

build-options:
  append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
  env:
    GOROOT: /usr/lib/sdk/golang
    GOTOOLCHAIN: local
    XDG_CACHE_HOME: /run/build/reManager/flatpak-node/cache
    npm_config_cache: /run/build/reManager/flatpak-node/npm-cache

modules:
  - name: reManager
    buildsystem: simple
    build-commands:
      - cp flatpak/vendor-modules.txt vendor/modules.txt
      - |
        for patch in build/wails-patches/*.patch; do
          patch -p1 -d vendor/github.com/wailsapp/wails/v3 < "$patch"
        done
      - npm install --offline --prefix=frontend
      - npm run build --prefix=frontend
      - go build -mod=vendor -tags production -trimpath -buildvcs=false -ldflags "-w -s -X main.version=$(git describe --tags --always)" -o reManager .
      - install -Dm755 reManager /app/bin/reManager
      - install -Dm644 flatpak/io.scottlabs.reManager.desktop /app/share/applications/io.scottlabs.reManager.desktop
      - install -Dm644 flatpak/io.scottlabs.reManager.metainfo.xml /app/share/metainfo/io.scottlabs.reManager.metainfo.xml
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.scottlabs.reManager.svg
    sources:
      - type: dir
        path: ..
        skip:
          - third_party
          - vendor
          - frontend/node_modules
          - frontend/dist
          - bin
          - build-dir
          - repo
          - .flatpak-builder
          - flatpak/.flatpak-builder
          - reManager.flatpak
          - reManager-gnome49.flatpak
      - type: archive
        url: https://proxy.golang.org/github.com/wailsapp/wails/v3/@v/v3.0.0-beta.26.zip
        sha256: 64010e5d1c0ddd05e17a07925bd620a263068669d3008cb422881d51e585de07
        strip-components: 4
        dest: vendor/github.com/wailsapp/wails/v3
      - node-sources.json
      - go-sources.yml
